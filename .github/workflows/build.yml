name: Build Selene APK

# Auto-builds a fresh APK on every push and on manual trigger, and attaches
# it to a GitHub Release. This is the "repo maintains itself" loop:
# push a fix to the injection shim -> CI ships a new debug APK.
#
# Gradle is provided by the setup-gradle action, so no wrapper jar needs to
# be committed to the repo.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: selene-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Selene (latest build)
          files: android/app/build/outputs/apk/debug/*.apk
          prerelease: true
