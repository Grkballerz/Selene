name: Build Selene APK

# Auto-builds a fresh APK on every push and on manual trigger, and attaches
# it to a GitHub Release. This is the "repo maintains itself" loop:
# push a fix to the injection shim -> CI ships a new signed APK.
#
# The APK is signed with a release key kept in repo Secrets (decoded below),
# so every build shares one certificate and installs in place over the last.
# Gradle is provided by the setup-gradle action, so no wrapper jar is committed.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "Release keystore decoded ($(wc -c < android/app/release.keystore) bytes)."
          else
            echo "::warning::No signing secrets set — release will fall back to the debug key."
          fi

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: selene-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Selene (latest build)
          files: android/app/build/outputs/apk/release/*.apk
          prerelease: true
